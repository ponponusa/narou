name: CI

# デフォルト権限。全ジョブに対して GITHUB_TOKEN は読み取りだけ許可。
permissions:
  contents: read

on:
  pull_request:
    branches: [ "develop", "release", "test-develop", "test-release" ]
  push:
    branches: [ "release", "test-release" ]

jobs:
  #
  # 1) PR用ビルド・テストジョブ
  #    - develop / release / test-develop / test-release 向け PR で走る
  #    - RSpec を実行
  #    - Astro UI のビルドとテスト
  #
  build-test:
    if: github.event_name == 'pull_request'
    name: narou-ci-tests
    runs-on: ubuntu-latest

    env:
      BUNDLE_JOBS: "1"
      BUNDLE_RETRY: "3"
      BUNDLE_PATH: vendor/bundle
      BUNDLER_VERSION: "2.7.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (3.4)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install bundler
        run: gem install bundler:${{ env.BUNDLER_VERSION }}

      - name: Cache bundle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-ruby-3.4-bundle-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ruby-3.4-bundle-
            ${{ runner.os }}-ruby-
            ${{ runner.os }}-

      - name: Bundle install
        run: |
          bundle _${BUNDLER_VERSION}_ config set path "${BUNDLE_PATH}"
          bundle _${BUNDLER_VERSION}_ check || bundle _${BUNDLER_VERSION}_ install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Astro UI
        working-directory: frontend
        run: npm run build

      - name: Check TypeScript types
        working-directory: frontend
        run: npm run check

      - name: Run RSpec
        run: |
          mkdir -p test_results/rspec
          bundle _${BUNDLER_VERSION}_ exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out test_results/rspec/results.xml

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-junit
          path: test_results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Upload Astro build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: frontend/dist

  #
  # 2) Linux/macOS 向けの汎用 gem をビルド
  #    - release / test-release ブランチへの push で実行
  #    - Astro UI をビルドして含める
  #
  build-gem-linux:
    if: github.event_name == 'push' && (github.ref_name == 'release' || github.ref_name == 'test-release')
    name: Build gem (generic)
    runs-on: ubuntu-latest

    env:
      BUNDLER_VERSION: "2.7.2"

    outputs:
      gemfile: ${{ steps.build.outputs.gemfile }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (3.4)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install bundler
        run: gem install bundler:${{ env.BUNDLER_VERSION }}

      - name: Bundle install
        run: |
          bundle _${BUNDLER_VERSION}_ install --path vendor/bundle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Astro UI
        working-directory: frontend
        run: npm run build

      - name: Get version
        id: get_version
        run: |
          VERSION=$(ruby -r ./lib/version.rb -e 'print Narou::VERSION + (Narou::COMMIT ? "-#{Narou::COMMIT}" : "")')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build gem (generic)
        id: build
        run: |
          gem build narou-mod.gemspec
          # 「mingw-ucrt」を含まないほうを汎用ビルド扱いにする
          GEMFILE=$(ls narou-mod-*.gem | grep -v mingw || true)
          echo "gemfile=${GEMFILE}" >> $GITHUB_OUTPUT

      - name: Upload generic gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: narou-gem-generic
          path: ${{ steps.build.outputs.gemfile }}

  #
  # 3) Windows (mingw-ucrt) 向け gem をビルド
  #    - release / test-release ブランチへの push で実行
  #    - Astro UI をビルドして含める
  #
  build-gem-windows:
    if: github.event_name == 'push' && (github.ref_name == 'release' || github.ref_name == 'test-release')
    name: Build gem (Windows mingw-ucrt)
    runs-on: windows-latest

    outputs:
      gemfile: ${{ steps.build.outputs.gemfile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (3.4 on Windows)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Build Astro UI
        working-directory: frontend
        shell: bash
        run: npm run build

      # Windows側では bundler/bundle install は実行しない
      # 依存を揃える必要はなく、gem build だけでよい

      - name: Build gem (mingw)
        id: build
        shell: bash
        run: |
          gem build narou-mod.gemspec
          # Windows向け: Gem::Platform::CURRENT が mingw-ucrt の .gem をpick
          GEMFILE=$(ls narou-mod-*-mingw-ucrt.gem)
          echo "gemfile=${GEMFILE}" >> $GITHUB_OUTPUT

      - name: Upload mingw gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: narou-gem-windows
          path: ${{ steps.build.outputs.gemfile }}

  #
  # 4) GitHub Release の作成/更新
  #    - 本番 release ブランチへの push のときだけ実行する
  #    - narou-mod-{version}.gem と narou-mod-{version}-x64-mingw-ucrt.gem を添付
  #
  release-draft:
    if: github.event_name == 'push' && github.ref_name == 'test-release'
    name: Create/Update Draft Release (staging)
    runs-on: ubuntu-latest
    needs: [ build-gem-linux, build-gem-windows ]

    permissions:
      contents: write

    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generic gem artifact
        uses: actions/download-artifact@v4
        with:
          name: narou-gem-generic
          path: dist

      - name: Download mingw gem artifact
        uses: actions/download-artifact@v4
        with:
          name: narou-gem-windows
          path: dist

      - name: List dist contents
        run: |
          echo "dist contains:"
          ls -R dist

      - name: Generate release body with license info
        id: gen_body
        run: |
          CURRENT_TAG="${{ needs.build-gem-linux.outputs.version }}"
          ALL_TAGS=$(git tag --sort=-creatordate)
          PREV_TAG=$(echo "$ALL_TAGS" | grep -v "^${CURRENT_TAG}$" | head -n1)

          echo "CURRENT_TAG=$CURRENT_TAG"
          echo "PREV_TAG=$PREV_TAG"

          {
            echo "## 📦 インストール案内"
            echo ""
            echo "- **Windows (mingw / MSYS2 など)** の場合:"
            echo "  → `narou-mod-${CURRENT_TAG}-x64-mingw-ucrt.gem` を使用してください。"
            echo ""
            echo "- **macOS / Linux** の場合:"
            echo "  → `narou-mod-${CURRENT_TAG}.gem` を使用してください。"
            echo ""
            echo "インストール方法:"
            echo "\`\`\`bash"
            echo "gem install ./ダウンロードしたファイル名.gem"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "## 🧩 ${PREV_TAG}からの変更点"
            else
              echo "## 🧩 変更点"
            fi
            echo ""
            RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
            git log ${RANGE:-HEAD} --pretty=format:'- %s (%h)' | grep -v -i "^-\s*merge" || echo "(No commits found)"
            echo ""
            echo "---"
            echo ""
            echo "## ⚖️ ライセンス・著作権表示"
            echo ""
            echo "- 本ソフトウェアは [narou.rb (by whiteleaf7)](https://github.com/whiteleaf7/narou) をオリジナルとしています。"
            echo "- 本リポジトリ ([ponponusa/narou](https://github.com/ponponusa/narou)) は、"
            echo "  オリジナルの narou.rb をベースに改良・保守を行っている非公式フォークです。"
            echo ""
            echo "- ライセンス: [MIT License](https://opensource.org/licenses/MIT)"
            echo "- 著作者: [whiteleaf7](https://github.com/whiteleaf7) (original), [Rumia-Channel](https://github.com/Rumia-Channel) (fork from), [ponponusa](https://github.com/ponponusa) (mod maintainer)"
            echo ""
            echo "この改良版はオープンソースライセンスに基づき配布されています。"
            echo "利用・再配布・改変は自由ですが、利用者自身の責任のもとで行ってください。"
            echo ""
            echo "---"
            echo ""
            echo "_※このリリースはドラフト (テスト用) です。一般公開前の検証ステージです。_"
            echo ""
            echo "_自動生成: GitHub Actions (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > release_body.md

          echo "----- release_body.md -----"
          cat release_body.md
          echo "body_path=release_body.md" >> $GITHUB_OUTPUT

      - name: Create or Update Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-gem-linux.outputs.version }}
          name: "${{ needs.build-gem-linux.outputs.version }} (draft)"
          draft: true         # 👈 ドラフトにする！
          prerelease: false
          files: dist/*.gem
          body_path: ${{ steps.gen_body.outputs.body_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-final:
    if: github.event_name == 'push' && github.ref_name == 'release'
    name: Create/Update Public Release
    runs-on: ubuntu-latest
    needs: [ build-gem-linux, build-gem-windows ]

    permissions:
      contents: write

    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generic gem artifact
        uses: actions/download-artifact@v4
        with:
          name: narou-gem-generic
          path: dist

      - name: Download mingw gem artifact
        uses: actions/download-artifact@v4
        with:
          name: narou-gem-windows
          path: dist

      - name: List dist contents
        run: |
          echo "dist contains:"
          ls -R dist

      - name: Generate release body with license info
        id: gen_body
        run: |
          CURRENT_TAG="${{ needs.build-gem-linux.outputs.version }}"
          ALL_TAGS=$(git tag --sort=-creatordate)
          PREV_TAG=$(echo "$ALL_TAGS" | grep -v "^${CURRENT_TAG}$" | head -n1)

          {
            echo "## 📦 インストール案内"
            echo ""
            echo "- **Windows (mingw / MSYS2 など)** の場合:"
            echo "  → `narou-mod-${CURRENT_TAG}-x64-mingw-ucrt.gem` を使用してください。"
            echo ""
            echo "- **macOS / Linux** の場合:"
            echo "  → `narou-mod-${CURRENT_TAG}.gem` を使用してください。"
            echo ""
            echo "インストール方法:"
            echo "\`\`\`bash"
            echo "gem install ./ダウンロードしたファイル名.gem"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "## 🧩 ${PREV_TAG}からの変更点"
            else
              echo "## 🧩 変更点"
            fi
            echo ""
            RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
            git log ${RANGE:-HEAD} --pretty=format:'- %s (%h)' | grep -v -i "^-\s*merge" || echo "(No commits found)"
            echo ""
            echo "---"
            echo ""
            echo "## ⚖️ ライセンス・著作権表示"
            echo ""
            echo "- 本ソフトウェアは [narou.rb (by whiteleaf7)](https://github.com/whiteleaf7/narou) をオリジナルとしています。"
            echo "- 本リポジトリ ([ponponusa/narou](https://github.com/ponponusa/narou)) は、"
            echo "  オリジナルの narou.rb をベースに改良・保守を行っている非公式フォークです。"
            echo ""
            echo "- ライセンス: [MIT License](https://opensource.org/licenses/MIT)"
            echo "- 著作者: [whiteleaf7](https://github.com/whiteleaf7) (original), [Rumia-Channel](https://github.com/Rumia-Channel) (fork from), [ponponusa](https://github.com/ponponusa) (mod maintainer)"
            echo ""
            echo "この改良版はオープンソースライセンスに基づき配布されています。"
            echo "利用・再配布・改変は自由ですが、利用者自身の責任のもとで行ってください。"
            echo ""
            echo "---"
            echo ""
            echo "_自動生成: GitHub Actions (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > release_body.md

          echo "body_path=release_body.md" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-gem-linux.outputs.version }}
          name: ${{ needs.build-gem-linux.outputs.version }}
          draft: false        # 👈 本番なので公開
          prerelease: false
          files: dist/*.gem
          body_path: ${{ steps.gen_body.outputs.body_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

